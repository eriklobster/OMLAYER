name: minecraft-survival
services:
  mc:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    tty: true
    stdin_open: true
    stop_grace_period: 2m
    ports:
      - "${BIND_IP:-127.0.0.1}:25565:25565/tcp"
      - "${BIND_IP:-127.0.0.1}:19132:19132/udp"
      - "${BIND_IP:-127.0.0.1}:19132:19132/tcp"
    environment:
      EULA: "${EULA:-FALSE}"
      TYPE: PAPER
      VERSION: "${MC_VERSION:-26.3}"
      MEMORY: "${MC_MEMORY:-2304M}"
      TZ: Asia/Bangkok
      MODE: survival
      DIFFICULTY: normal
      PVP: "TRUE"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      MAX_PLAYERS: "${MAX_PLAYERS:-6}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-6}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-4}"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD:?Set a unique RCON password in .env}"
      ENABLE_COMMAND_BLOCK: "FALSE"
      MOTD: Vanilla survival | Java + Bedrock
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
      MODRINTH_PROJECTS: |
        luckperms
        chunky
    volumes:
      - ./data:/data
  backups:
    image: itzg/mc-backup:latest
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
    environment:
      TZ: Asia/Bangkok
      RCON_HOST: mc
      RCON_PASSWORD: "${RCON_PASSWORD:?Set a unique RCON password in .env}"
      BACKUP_INTERVAL: "6h"
      INITIAL_DELAY: "0"
      PRUNE_BACKUPS_DAYS: "7"
      PRUNE_BACKUPS_COUNT: "28"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
