name: Aumyra MVP tests

on:
  push:
    branches:
      - feat/aumyra-assistant-mvp
    paths:
      - 'apps/aumyra/**'
      - '.github/workflows/aumyra-ci.yml'
  pull_request:
    paths:
      - 'apps/aumyra/**'
      - '.github/workflows/aumyra-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node 22 behavior tests
        run: node --test apps/aumyra/test/*.test.mjs
      - name: Cloudflare Worker bundle dry run (no remote deployment)
        working-directory: apps/aumyra
        shell: bash
        run: |
          npm install --no-audit --no-fund
          python3 - <<'PY'
          from pathlib import Path
          cfg=Path("wrangler.toml")
          source=cfg.read_text()
          assert "REPLACE_WITH_AUMYRA_D1_ID" in source
          cfg.write_text(source.replace("REPLACE_WITH_AUMYRA_D1_ID","00000000-0000-0000-0000-000000000000"))
          PY
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/aumyra-bundle"
      - name: Aumyra PowerShell bootstrap syntax validation (no remote changes)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $scriptPath = "apps/aumyra/scripts/bootstrap.ps1"
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $scriptPath), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host "PowerShell bootstrap syntax valid."
      - name: SQLite schema smoke
        shell: bash
        run: |
          python3 - <<'PY'
          import sqlite3, pathlib
          db=sqlite3.connect(":memory:")
          for migration in sorted(pathlib.Path("apps/aumyra/migrations").glob("*.sql")):
              db.executescript(migration.read_text())
          for table in ("aumyra_entries","aumyra_notes","aumyra_processed_updates","aumyra_undo_ops","aumyra_ai_turns","aumyra_chat_resets","aumyra_compose_modes"):
              assert db.execute("SELECT name FROM sqlite_master WHERE type='table' AND name=?",(table,)).fetchone()
          db.execute("INSERT INTO aumyra_entries(kind,amount_cents,currency,category,note,created_at,update_id) VALUES ('expense',1250,'USDT','food','coffee','2026-11-13T07:00:00Z',10)")
          db.execute("INSERT OR IGNORE INTO aumyra_entries(kind,amount_cents,currency,category,note,created_at,update_id) VALUES ('expense',1250,'USDT','food','coffee','2026-11-13T07:00:00Z',10)")
          assert db.execute("SELECT COUNT(*) FROM aumyra_entries").fetchone()[0]==1
          print("SQL schema + unique update_id smoke OK")
          PY
